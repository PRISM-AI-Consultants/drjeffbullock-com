<style>
  :root{
    --navy:#000321; --ink:#f6f6ff; --muted:#afb8bc; --blue:#2f6bff; --site-blue:#188bf6; --gold:#f2c14e;

  .player video{display:block;width:100%;aspect-ratio:16/9;background:#02040f}
  .copy{opacity:0;transform:translateY(16px);animation:in .9s var(--ease) .3s forwards}
  .eyebrow{font-family:Oswald,sans-serif;font-weight:500;letter-spacing:.22em;text-transform:uppercase;font-size:13px;color:var(--gold)}
  h1{font-family:Oswald,sans-serif;font-weight:700;font-size:clamp(44px,6vw,84px);line-height:.95;letter-spacing:.01em;margin-top:14px}
  h1 b{color:var(--blue);font-weight:700}
  .sub{font-family:"Playfair Display",serif;font-style:italic;font-size:clamp(20px,2.1vw,28px);color:var(--gold);margin-top:14px}
  .by{margin-top:18px;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .rule{width:64px;height:3px;background:var(--gold);margin:28px 0}
  .cta{display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:var(--navy);text-decoration:none;

  .cta:hover{transform:translateY(-2px);box-shadow:0 12px 30px -10px rgba(242,193,78,.6)}
  .cta svg{width:18px;height:18px}
  .dl{margin-top:22px;font-size:14px;color:var(--muted);line-height:1.9}
  .dl a{color:var(--ink);text-underline-offset:3px;text-decoration-color:rgba(246,246,255,.35)}
  .dl a:hover{text-decoration-color:var(--gold)}
  footer{padding:18px clamp(16px,5vw,64px);font-size:12px;color:#565a7c;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  footer a{color:#7d84a8}
  @keyframes in{to{opacity:1;transform:none}}
  @media (max-width:900px){
    main{grid-template-columns:1fr}
    .copy{order:2}
  }
  @media (prefers-reduced-motion:reduce){.player,.copy{animation:none;opacity:1;transform:none}}
